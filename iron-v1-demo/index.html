<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>IRON V1 DEMO · Aethrion — Motor Cognitivo</title>
<style>
:root{color-scheme:dark;--ink:#f0e6cf;--gold:#d9ae57;--rust:#a4573a;--steel:#2a3138;--panel:#12161acc;--line:#d9ae5733}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e11;color:var(--ink);font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased;user-select:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:14px;font-size:13px}
#topbar{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;text-shadow:0 1px 4px #000}
#brand{letter-spacing:3px;color:var(--gold);font-size:15px;font-weight:bold}
#brand small{display:block;letter-spacing:1px;color:#b9a884;font-size:9px;font-weight:normal}
#clock{color:#e9d9b2}
#weatherline{color:#9fb2a5}
#hudstats{margin-top:6px;color:#b9a884;font-size:11px;display:flex;gap:14px;flex-wrap:wrap;text-shadow:0 1px 3px #000}
#selectedbar{position:absolute;left:14px;bottom:96px;width:340px;max-width:calc(100vw - 28px);background:var(--panel);border:1px solid var(--line);padding:10px 12px;backdrop-filter:blur(4px);display:none}
#selectedbar.on{display:block}
#selectedbar b{color:var(--gold);letter-spacing:1px;font-size:13px}
#selectedbar p{margin:5px 0;line-height:1.35;font-size:12px;color:#d8cdb4}
#selectedbar em{color:#94a99a;font-style:normal;font-size:11px}
#controls{position:fixed;left:0;bottom:0;padding:11px 14px;display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap;background:linear-gradient(transparent,#080a0cdd 60%);width:100%}
button{background:#141a1f;color:#e3d7bd;border:1px solid #d9ae5744;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.5px;transition:.15s}
button:hover{background:#20282f;border-color:var(--gold)}
button.on{background:var(--gold);color:#15120c;border-color:var(--gold);font-weight:bold}
#timebtns{display:flex;gap:4px}
#hudhelp{color:#7d8a80;font-size:10px;margin-left:auto;text-align:right;line-height:1.4}
#eventtoast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#1a1410ee;border:1px solid var(--gold);padding:8px 18px;color:var(--gold);letter-spacing:1px;font-size:12px;opacity:0;transition:opacity .4s;pointer-events:none}
#eventtoast.on{opacity:1}
#feed{position:fixed;right:14px;top:84px;width:330px;max-width:calc(100vw - 380px);display:flex;flex-direction:column;gap:4px;pointer-events:none;align-items:flex-end}
#feed div{background:#0e1216cc;border-left:2px solid var(--rust);padding:4px 8px;font-size:11px;color:#cfc3aa;max-width:100%;line-height:1.3}
#feed b{color:var(--gold);font-weight:normal}
/* Inspector */
.ins{position:fixed;right:0;top:0;bottom:0;width:470px;max-width:100vw;background:#0d1115f2;border-left:1px solid var(--line);display:flex;flex-direction:column;font-size:12px;z-index:20}
.ins-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);letter-spacing:2px;color:var(--gold);font-size:11px}
.ins-close{cursor:pointer;font-size:18px;color:#9a8d72;line-height:1}
.ins-toolbar{display:flex;gap:5px;padding:8px;border-bottom:1px solid #ffffff0d;flex-wrap:wrap}
.ins-toolbar button{font-size:10px;padding:4px 7px}
.ins-lod{padding:5px 10px;color:#7f8d80;font-size:10px;border-bottom:1px solid #ffffff0d}
.ins-body{display:flex;flex:1;min-height:0}
.ins-list{width:170px;overflow-y:auto;border-right:1px solid #ffffff10;background:#0a0d10}
.ins-list-head{padding:8px;color:#9d8f70;font-size:10px;letter-spacing:1px;border-bottom:1px solid #ffffff0d;display:flex;justify-content:space-between}
.ins-item{padding:6px 8px;border-bottom:1px solid #ffffff08;cursor:pointer;line-height:1.25}
.ins-item:hover{background:#161c22}
.ins-item.on{background:#1e262d;box-shadow:inset 2px 0 0 var(--gold)}
.ins-item b{display:block;color:#e7dcc4;font-size:11px;font-weight:normal}
.ins-item span{display:block;color:#8f9e90;font-size:9.5px}
.ins-item em{display:block;color:#b98f5a;font-size:9.5px;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-detail{flex:1;display:flex;flex-direction:column;min-width:0}
.ins-tabs{display:flex;border-bottom:1px solid #ffffff10;overflow-x:auto}
.ins-tabs button{border:none;background:none;padding:7px 8px;font-size:10px;color:#98a495;border-bottom:2px solid transparent}
.ins-tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.ins-content{flex:1;overflow-y:auto;padding:10px 12px;line-height:1.4}
.ins-content h3{margin:0 0 2px;color:var(--gold);font-size:15px;letter-spacing:1px}
.ins-content h4{margin:10px 0 5px;color:#c3b391;font-size:11px;letter-spacing:1px;font-weight:normal;border-bottom:1px solid #ffffff0d;padding-bottom:3px}
.ins-sub{color:#8d9b8f;font-size:10.5px;margin:0 0 8px}
.ins-sep{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:9px 0}
.ins-kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:11px}
.ins-kv span{color:#93a094}
.ins-kv b{color:#e4d7bc;font-weight:normal;text-align:right;max-width:65%;word-break:break-word}
.ins-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.ins-label{width:96px;color:#93a094;font-size:10px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-bar{flex:1;height:6px;background:#1b2228;position:relative}
.ins-bar i{display:block;height:100%;background:#5b8a6a;transition:width .25s}
.ins-bar.warn i{background:#b3613f}
.ins-bar.emo i{background:#8a6aa8}
.ins-bar.pers i{background:#5a7a9a}
.ins-bar.skill i{background:#a08a4a}
.ins-bar.know i{background:#4a8a86}
.ins-val{width:30px;text-align:right;color:#c6bda8;font-size:9.5px}
.ins-flavour{color:#cfc3a8;font-style:italic;font-size:11px;line-height:1.45;margin:4px 0}
.ins-quote{border-left:2px solid var(--rust);padding:2px 8px;margin:8px 0;color:#dccaa8;font-size:11px}
.ins-quote small{color:#8d9b8f}
.ins-note{color:#c08a5a;font-size:10.5px;line-height:1.4;margin:5px 0}
.ins-empty{color:#6f7c72;font-size:11px}
.ins-chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.ins-chips span{background:#1b2329;border:1px solid #ffffff12;padding:1px 6px;font-size:10px;color:#c0b191}
.ins-goal{border-left:2px solid #6a5a3a;padding:2px 7px;margin:4px 0}
.ins-goal b{display:block;color:#e2d4b6;font-size:11px;font-weight:normal}
.ins-goal span{display:block;color:#8f9e90;font-size:9.5px}
.ins-goal em{display:block;color:#a89a7c;font-size:9.5px;font-style:italic}
.ins-mem{padding:3px 0;border-bottom:1px solid #ffffff08}
.ins-mem b{display:block;color:#ddd0b6;font-size:10.5px;font-weight:normal}
.ins-mem span{color:#869585;font-size:9.5px}
.ins-foot{border-top:1px solid var(--line);padding:7px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ins-foot button{font-size:9.5px;padding:3px 6px}
.ins-hint{color:#8d9b8f;font-size:9.5px;letter-spacing:1px}
.ins-desc{padding:8px;border-top:1px solid #ffffff10;display:flex;gap:6px}
.ins-desc textarea{flex:1;height:54px;background:#0a0d10;color:#e4d7bc;border:1px solid #d9ae5733;padding:5px;font-family:inherit;font-size:11px;resize:none}
@media (max-width:820px){
  .ins{width:100vw;top:auto;height:64vh}
  #feed{display:none}
  #selectedbar{bottom:auto;top:78px}
  #hudhelp{display:none}
}
</style>
</head>
<body>
<div id="hud">
  <div id="topbar">
    <div id="brand">IRON V1 DEMO<small>AETHRION · MOTOR COGNITIVO UNIVERSAL</small></div>
    <div id="clock">—</div>
    <div id="weatherline">—</div>
  </div>
  <div id="hudstats">
    <span id="stat-pop">—</span>
    <span id="stat-lod">—</span>
    <span id="stat-alert">—</span>
    <span id="stat-fps">—</span>
  </div>
  <div id="feed"></div>
</div>
<div id="selectedbar"><b id="sel-name"></b><p id="sel-doing"></p><em id="sel-why"></em></div>
<div id="eventtoast"></div>
<div id="controls">
  <div id="timebtns">
    <button data-speed="0">❚❚</button>
    <button data-speed="60">x60</button>
    <button data-speed="300" class="on">x300</button>
    <button data-speed="1800">x1800</button>
    <button data-speed="7200">x7200</button>
  </div>
  <button id="btn-gen">+ Habitante</button>
  <button id="btn-cast">Repoblar</button>
  <button id="btn-inspector" class="on">Inspector</button>
  <div id="hudhelp">Arrastra para orbitar · rueda para acercar<br>Clic en un habitante para inspeccionarlo</div>
</div>
<div id="inspector-host"></div>

<script src="lib/three.r128.min.js"></script>
<script src="ai/core/util.js"></script>
<script src="ai/biology/species.js"></script>
<script src="ai/biology/anatomy.js"></script>
<script src="ai/biology/senses.js"></script>
<script src="ai/cognition/memory.js"></script>
<script src="ai/cognition/emotion.js"></script>
<script src="ai/cognition/perception.js"></script>
<script src="ai/personality/personality.js"></script>
<script src="ai/culture/culture.js"></script>
<script src="ai/environment/astronomy.js"></script>
<script src="ai/environment/climate.js"></script>
<script src="ai/planning/needs_goals.js"></script>
<script src="ai/planning/goap.js"></script>
<script src="ai/cognition/reasoning.js"></script>
<script src="ai/simulation/combat.js"></script>
<script src="ai/core/brain.js"></script>
<script src="ai/simulation/world.js"></script>
<script src="ai/interfaces/factory.js"></script>
<script src="ai/debug/inspector.js"></script>
<script src="src/demo.js"></script>
</body>
</html>
